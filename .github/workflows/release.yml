# Builds the Windows exe and the signed APK, and publishes them with SHA256SUMS.txt.
#
# Release: bump the versions (desktop/app/Cargo.toml, desktop/core/Cargo.toml,
# desktop/app/tauri.conf.json, android/app/build.gradle.kts), write the notes to
# docs/releases/vX.Y.Z.md, commit, then `git tag vX.Y.Z && git push origin main vX.Y.Z`.
#
# Run it by hand (Actions → Release → Run workflow) to build without publishing; the files
# are attached to the run as an artifact.
#
# Secrets: ANDROID_KEYSTORE_BASE64 (the .jks, base64), ANDROID_STORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        name: Check that every version matches
        shell: bash
        run: |
          app=$(sed -n 's/^version = "\(.*\)"/\1/p' desktop/app/Cargo.toml)
          core=$(sed -n 's/^version = "\(.*\)"/\1/p' desktop/core/Cargo.toml)
          tauri=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' desktop/app/tauri.conf.json)
          android=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          echo "Cargo $app, core $core, tauri $tauri, Android $android"
          for v in "$core" "$tauri" "$android"; do
            [ "$v" = "$app" ] || { echo "::error::versions differ"; exit 1; }
          done
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$app" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version $app"; exit 1
          fi
          echo "version=$app" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Build
        shell: bash
        working-directory: desktop
        # build.rs bundles adb from the runner's Android SDK (ANDROID_HOME/platform-tools).
        run: |
          ls "$ANDROID_HOME/platform-tools/adb.exe"
          cargo build --release -p syncboard
          mkdir -p ../out
          cp target/release/syncboard.exe "../out/SyncBoard-${{ needs.version.outputs.version }}-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir"
          echo "$KEYSTORE" | base64 -d > "$dir/release.jks"
          {
            echo "storeFile=$dir/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$dir/keystore.properties"
          echo "SYNCBOARD_SIGNING=$dir/keystore.properties" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        working-directory: android
        env:
          SYNCBOARD_REQUIRE_SIGNING: "1"
        run: |
          ./gradlew assembleRelease :app:testDebugUnitTest
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk "../out/SyncBoard-${{ needs.version.outputs.version }}.apk"
      - name: Check the signing certificate
        shell: bash
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs out/*.apk | tee certs.txt
          grep -q "CN=SyncBoard" certs.txt || { echo "::error::APK is not signed with the SyncBoard release key"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  publish:
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        shell: bash
        working-directory: out
        # The in-app updaters match "<hash>  <name>" exactly: no "*" before names.
        run: |
          sha256sum SyncBoard-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.version.outputs.version }}
          path: out/*
      - name: Publish
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="docs/releases/$tag.md"
          if [ -f "$notes" ]; then args=(--notes-file "$notes"); else args=(--generate-notes); fi
          gh release create "$tag" --title "$tag" "${args[@]}" out/*
