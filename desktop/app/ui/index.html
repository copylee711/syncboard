<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SyncBoard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="titlebar" data-tauri-drag-region>
    <img src="logo.png" alt="" class="tb-logo" data-tauri-drag-region />
    <span class="tb-title" data-tauri-drag-region>SyncBoard</span>
    <span class="tb-spacer" data-tauri-drag-region></span>
    <button class="tb-btn" id="minBtn" aria-label="最小化"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
    <button class="tb-btn close" id="closeBtn" aria-label="关闭到托盘" title="关闭到托盘（轻量模式）"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7m0-7l-7 7"/></svg></button>
  </div>

  <main>
    <section class="status-block">
      <div class="status-line">
        <span class="dot" id="statusDot"></span>
        <span class="status-label" id="statusLabel">未连接</span>
        <label class="pill-switch" title="剪贴板同步">
          <input type="checkbox" id="syncToggle" checked />
          <span id="syncLabel">同步中</span>
        </label>
      </div>
      <h1 id="statusTitle">等待手机连接</h1>
      <p class="lead" id="statusSub">在手机上打开 SyncBoard 扫码配对</p>
      <div class="actions">
        <button class="btn ink" id="sendBtn">
          <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0l-4.5 4.5M12 4l4.5 4.5M5 15v3a2 2 0 002 2h10a2 2 0 002-2v-3"/></svg>
          发送文件
        </button>
        <button class="btn" id="folderBtn">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
          接收文件夹
        </button>
      </div>
    </section>

    <section>
      <div class="section-head">
        <h2>设备</h2>
        <button class="link" id="addBtn">添加手机</button>
      </div>
      <div id="peers" class="group"></div>
    </section>

    <section id="transfersSection" hidden>
      <div class="section-head"><h2>传输</h2></div>
      <div id="transfers" class="group"></div>
    </section>

    <section>
      <div class="section-head"><h2>同步</h2></div>
      <div class="group">
        <label class="row"><span>文本</span><span class="switch"><input type="checkbox" data-setting="sync_text" /><i></i></span></label>
        <label class="row"><span>图片</span><span class="switch"><input type="checkbox" data-setting="sync_images" /><i></i></span></label>
        <label class="row"><span>自动接收文件</span><span class="switch"><input type="checkbox" data-setting="auto_accept_files" /><i></i></span></label>
        <div class="row"><span>接收位置<small id="downloadDir"></small></span><button class="btn small" id="folderBtn2">打开</button></div>
      </div>
    </section>

    <section>
      <div class="section-head"><h2>电脑</h2></div>
      <div class="group">
        <label class="row"><span>开机自动启动</span><span class="switch"><input type="checkbox" id="autostart" /><i></i></span></label>
        <label class="row"><span>右键「发送到」菜单</span><span class="switch"><input type="checkbox" id="sendto" /><i></i></span></label>
      </div>
    </section>

    <details class="advanced">
      <summary>高级：通过 USB (ADB) 启动手机服务</summary>
      <div class="group">
        <p class="hint">通常不需要：手机端可以通过「无线调试」自行启动服务。只有手机端无法自启时，才用数据线连接电脑并开启 USB 调试。</p>
        <label class="row"><span>检测到 USB 设备时自动启动<small id="adbPath"></small></span><span class="switch"><input type="checkbox" data-setting="auto_adb" /><i></i></span></label>
        <div class="row"><span>立即启动</span><button class="btn small" id="adbBtn">启动</button></div>
      </div>
    </details>
    <footer>关闭窗口后，SyncBoard 会以轻量模式留在托盘里继续同步。</footer>
  </main>

  <div class="sheet-backdrop" id="pairSheet" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <h3>添加手机</h3>
        <button class="icon-btn" id="closePair" aria-label="关闭"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7m0-7l-7 7"/></svg></button>
      </div>
      <div class="qr" id="qr"></div>
      <ol class="steps">
        <li>在手机上打开 SyncBoard</li>
        <li>点「扫码配对」，对准上面的二维码</li>
      </ol>
      <div class="manual">无法扫码时，在手机上选「手动连接」并输入 <b id="ips"></b></div>
    </div>
  </div>

  <div class="sheet-backdrop" id="codeSheet" hidden>
    <div class="sheet narrow">
      <h3 id="codeTitle">配对请求</h3>
      <p class="muted">确认手机上显示的数字与下方一致</p>
      <div class="code" id="codeDigits"></div>
      <div class="sheet-actions">
        <button class="btn" id="rejectBtn">拒绝</button>
        <button class="btn ink" id="acceptBtn">接受</button>
      </div>
    </div>
  </div>

  <div class="drop" id="drop" hidden><div>松开即可发送到手机</div></div>
  <div class="toasts" id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
