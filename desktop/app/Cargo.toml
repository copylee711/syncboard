[package]
name = "syncboard"
version = "0.3.4"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
miniz_oxide = "0.8"

[dependencies]
syncboard-core = { path = "../core" }
tauri = { version = "2.12", features = ["tray-icon", "image-ico"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
winreg = "0.55"
miniz_oxide = "0.8"
base64 = "0.22"
windows = { version = "0.61", features = ["Foundation", "Networking_Connectivity", "Networking_NetworkOperators", "UI_Notifications", "Data_Xml_Dom", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_EnhancedStorage"] }
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
